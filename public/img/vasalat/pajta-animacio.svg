<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Pajtaajtó-vasalat: szemléltető animáció">
<style>
.va-lbl{font:500 22px var(--font-primary,'Inter',sans-serif);fill:#d0d0d0;paint-order:stroke;stroke:#161616;stroke-width:5px;stroke-linejoin:round}
.va-lbl2{font:500 17px var(--font-primary,'Inter',sans-serif);fill:#d0d0d0;paint-order:stroke;stroke:#161616;stroke-width:4px;stroke-linejoin:round}
.va-cap{font:600 25px var(--font-display,'Outfit',sans-serif);fill:#f5f5f5;text-anchor:middle}
.va-tb{font:600 13px var(--font-display,'Outfit',sans-serif);fill:#e5e5e5;letter-spacing:.06em}
.va-tb2{font:400 12px var(--font-primary,'Inter',sans-serif);fill:#a0a0a0}
.va-in{animation:va-in .6s both}
.va-dr{stroke-dasharray:1;stroke-dashoffset:1;animation:va-draw 1s both ease-in-out}
.va-drop{animation:va-drop .7s both cubic-bezier(.3,1.4,.6,1)}
.va-det{animation:va-zoom 1.4s 6.2s both cubic-bezier(.6,0,.3,1)}
.va-detlbl{animation:va-in .5s both,va-out .4s 5.8s forwards}
.va-elev{animation:va-in .8s 6.9s both}
.va-elevlbl{animation:va-in .6s 8s both}
.va-slide{animation:va-slide 5.4s 8.6s both ease-in-out}
.va-spin{transform-box:fill-box;transform-origin:center;animation:va-spin 5.4s 8.6s both ease-in-out}
.va-c1{animation:va-cap 5.6s .2s both}.va-c2{animation:va-cap 4.4s 6.2s both}.va-c3{animation:va-cap-last .6s 10.8s both}
@keyframes va-in{from{opacity:0}to{opacity:1}}
@keyframes va-out{to{opacity:0}}
@keyframes va-draw{to{stroke-dashoffset:0}}
@keyframes va-drop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes va-zoom{to{transform:translate(14px,14px) scale(.24)}}
@keyframes va-slide{0%{transform:none}38%{transform:translateX(-212px)}62%{transform:translateX(-212px)}100%{transform:none}}
@keyframes va-spin{0%{transform:none}38%{transform:rotate(-810deg)}62%{transform:rotate(-810deg)}100%{transform:none}}
@keyframes va-cap{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
@keyframes va-cap-last{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-delay:0s!important;animation-duration:1ms!important}}
</style>
<defs>
<pattern id="va-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.045)"/></pattern>
<pattern id="va-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#2a2826"/><path d="M0 0V10" stroke="#5a5650" stroke-width="2"/></pattern>
<linearGradient id="va-stV" x1="0" x2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".45" stop-color="#cfcfcf"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient>
<linearGradient id="va-stH" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".45" stop-color="#cfcfcf"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient>
<linearGradient id="va-blk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset=".5" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
<pattern id="va-wood" width="44" height="80" patternUnits="userSpaceOnUse"><rect width="44" height="80" fill="#8a5d36"/><path d="M7 0Q10 40 7 80M18 0Q15 26 19 52T18 80M30 0Q33 34 29 80M39 0Q37 40 40 80" fill="none" stroke="#6e4728" stroke-width="1.3"/></pattern>
<radialGradient id="va-disc"><stop offset="0" stop-color="#6a6a6a"/><stop offset="1" stop-color="#262626"/></radialGradient>
<marker id="va-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4a373"/></marker>
<linearGradient id="va-shadow" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(0,0,0,.55)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></linearGradient>
</defs>
<rect width="600" height="700" fill="#141414"/>
<rect class="va-in" width="600" height="700" fill="url(#va-grid)"/>
<g class="va-elev"><rect x="20" y="104" width="560" height="488" fill="rgba(255,255,255,0.03)"/><path d="M20 104H580" stroke="#6a6a6a" stroke-width="1.5"/><rect x="20" y="592" width="560" height="10" fill="url(#va-hatch)"/><path d="M20 592H580" stroke="#b0b0b0" stroke-width="1.8"/><rect x="362" y="214" width="176" height="378" fill="#0b0b0b"/><path d="M362 592V214H538V592" fill="none" stroke="#7a7a7a" stroke-width="1.5"/><rect x="402" y="284" width="70" height="110" fill="#1d2a22" stroke="#33463a"/><rect x="172" y="159" width="390" height="20" rx="3" fill="url(#va-blk)" stroke="#6a6a6a"/><g fill="#555"><circle cx="190" cy="169" r="3"/><circle cx="330" cy="169" r="3"/><circle cx="520" cy="169" r="3"/></g><g class="va-slide"><rect x="350" y="196" width="200" height="392" rx="2" fill="url(#va-wood)" stroke="#d9c3a5" stroke-width="1.8"/><rect x="378" y="236" width="144" height="157" rx="2" fill="none" stroke="#4a2e18" stroke-width="2.2"/><rect x="378" y="413" width="144" height="157" rx="2" fill="none" stroke="#4a2e18" stroke-width="2.2"/><rect x="366" y="384" width="14" height="66" rx="4" fill="url(#va-stV)" stroke="#9a9a9a"/><g fill="url(#va-blk)" stroke="#6a6a6a"><rect x="372" y="150" width="16" height="96" rx="3"/><rect x="512" y="150" width="16" height="96" rx="3"/></g><g class="va-spin"><circle cx="380" cy="150" r="15" fill="url(#va-disc)" stroke="#9a9a9a" stroke-width="1.4"/><circle cx="380" cy="150" r="4.5" fill="#3a3a3a" stroke="#9a9a9a"/><path d="M380 138V144.8M368.0 156.8L375.5 152.6M392.0 156.8L384.5 152.6" stroke="#121212" stroke-width="3"/></g><g class="va-spin"><circle cx="520" cy="150" r="15" fill="url(#va-disc)" stroke="#9a9a9a" stroke-width="1.4"/><circle cx="520" cy="150" r="4.5" fill="#3a3a3a" stroke="#9a9a9a"/><path d="M520 138V144.8M508.0 156.8L515.5 152.6M532.0 156.8L524.5 152.6" stroke="#121212" stroke-width="3"/></g></g></g>
<g class="va-elevlbl" style="animation-delay:8s"><path d="M470 160L490 132" stroke="#8a8a8a" stroke-width="1.2"/><text x="572" y="126" text-anchor="end" class="va-lbl2">látszó sín és görgők</text></g>
<g class="va-det">
<rect x="0" y="0" width="600" height="610" fill="#161616"/>
<rect class="va-in" width="600" height="610" fill="url(#va-grid)"/>
<g class="va-in" style="animation-delay:1.0s"><rect x="60" y="30" width="90" height="560" fill="url(#va-hatch)"/><rect x="150" y="30" width="8" height="560" fill="#4d4a45"/></g><path class="va-dr" pathLength="1" style="animation-delay:0.3s" d="M158 30V590M60 30V590" fill="none" stroke="#b0b0b0" stroke-width="2.2" /><g class="va-in" style="animation-delay:2.0s"><rect x="158" y="230" width="14" height="120" rx="2" fill="url(#va-stV)"/></g><path class="va-dr" pathLength="1" style="animation-delay:1.8s" d="M158 230H172V350H158Z" fill="none" stroke="#d4a373" stroke-width="2.2" /><g class="va-in" style="animation-delay:2.6s"><rect x="172" y="278" width="36" height="24" rx="3" fill="url(#va-stH)"/><rect x="208" y="230" width="14" height="120" rx="2" fill="url(#va-stV)"/><rect x="222" y="274" width="16" height="32" rx="4" fill="url(#va-stV)" stroke="#9a9a9a"/></g><path class="va-dr" pathLength="1" style="animation-delay:2.6s" d="M208 230H222V350H208Z" fill="none" stroke="#d4a373" stroke-width="2.2" /><g class="va-drop" style="animation-delay:3.4s"><rect x="205" y="138" width="20" height="92" rx="7" fill="url(#va-stV)" stroke="#b0b0b0" stroke-width="1.4"/><rect x="225" y="176" width="78" height="14" rx="3" fill="url(#va-stH)" stroke="#9a9a9a"/></g><g class="va-in" style="animation-delay:4.0s"><rect x="303" y="150" width="14" height="430" fill="url(#va-stV)" stroke="#b0b0b0"/></g><g class="va-in" style="animation-delay:4.4s"><rect x="250" y="390" width="53" height="200" fill="url(#va-wood)" stroke="#d9c3a5" stroke-width="1.8"/><rect x="176" y="362" width="127" height="14" rx="3" fill="url(#va-stH)" stroke="#9a9a9a"/></g><g class="va-detlbl" style="animation-delay:0.9s,5.8s"><path d="M105 40L105 40" stroke="#8a8a8a" stroke-width="1.4"/><text x="105" y="24" class="va-lbl" text-anchor="middle">fal</text></g><g class="va-detlbl" style="animation-delay:2.3s,5.8s"><path d="M165 345L120 420" stroke="#8a8a8a" stroke-width="1.4"/><text x="40" y="445" class="va-lbl" text-anchor="start">belső sín</text></g><g class="va-detlbl" style="animation-delay:2.9s,5.8s"><path d="M190 290L330 255" stroke="#8a8a8a" stroke-width="1.4"/><text x="336" y="262" class="va-lbl" text-anchor="start">távtartó</text></g><g class="va-detlbl" style="animation-delay:3.9s,5.8s"><path d="M220 150L330 110" stroke="#8a8a8a" stroke-width="1.4"/><text x="336" y="112" class="va-lbl" text-anchor="start">kerék a külső sínen</text></g><g class="va-detlbl" style="animation-delay:4.3s,5.8s"><path d="M317 300L360 320" stroke="#8a8a8a" stroke-width="1.4"/><text x="366" y="328" class="va-lbl" text-anchor="start">függesztő</text></g><g class="va-detlbl" style="animation-delay:4.6s,5.8s"><path d="M250 370L360 400" stroke="#8a8a8a" stroke-width="1.4"/><text x="366" y="408" class="va-lbl" text-anchor="start">kiugrásgátló</text></g><g class="va-detlbl" style="animation-delay:4.8s,5.8s"><path d="M300 520L360 520" stroke="#8a8a8a" stroke-width="1.4"/><text x="366" y="528" class="va-lbl" text-anchor="start">ajtólap</text></g>
<rect x="0" y="0" width="600" height="610" fill="none" stroke="#d4a373" stroke-width="7" class="va-in" style="animation-delay:6.2s"/>
</g>
<path d="M0 620H600" stroke="rgba(255,255,255,.12)"/>
<text x="300" y="664" class="va-cap va-c1">Két sín, a kerék a külsőn fut.</text><text x="300" y="664" class="va-cap va-c2">A vasalat látványelem lesz.</text><text x="300" y="664" class="va-cap va-c3">Végiggördül, nem leng ki.</text>
<g class="va-in" style="animation-delay:.2s"><text x="20" y="694" class="va-tb">ROLL’N’DOOR · PAJTAAJTÓ-VASALAT</text><text x="580" y="694" text-anchor="end" class="va-tb2">szemléltető, nem méretarányos</text></g>
</svg>
