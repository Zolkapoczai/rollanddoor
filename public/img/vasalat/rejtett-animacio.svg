<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Rejtett vasalat: szemléltető animáció">
<style>
.va-lbl{font:500 22px var(--font-primary,'Inter',sans-serif);fill:#d0d0d0;paint-order:stroke;stroke:#161616;stroke-width:5px;stroke-linejoin:round}
.va-lbl2{font:500 17px var(--font-primary,'Inter',sans-serif);fill:#d0d0d0;paint-order:stroke;stroke:#161616;stroke-width:4px;stroke-linejoin:round}
.va-cap{font:600 25px var(--font-display,'Outfit',sans-serif);fill:#f5f5f5;text-anchor:middle}
.va-tb{font:600 13px var(--font-display,'Outfit',sans-serif);fill:#e5e5e5;letter-spacing:.06em}
.va-tb2{font:400 12px var(--font-primary,'Inter',sans-serif);fill:#a0a0a0}
.va-in{animation:va-in .6s both}
.va-dr{stroke-dasharray:1;stroke-dashoffset:1;animation:va-draw 1s both ease-in-out}
.va-drop{animation:va-drop .7s both cubic-bezier(.3,1.4,.6,1)}
.va-det{animation:va-zoom 1.4s 6.2s both cubic-bezier(.6,0,.3,1)}
.va-detlbl{animation:va-in .5s both,va-out .4s 5.8s forwards}
.va-elev{animation:va-in .8s 6.9s both}
.va-elevlbl{animation:va-in .6s 8s both}
.va-slide{animation:va-slide 5.4s 8.6s both ease-in-out}
.va-spin{transform-box:fill-box;transform-origin:center;animation:va-spin 5.4s 8.6s both ease-in-out}
.va-c1{animation:va-cap 5.6s .2s both}.va-c2{animation:va-cap 4.4s 6.2s both}.va-c3{animation:va-cap-last .6s 10.8s both}
@keyframes va-in{from{opacity:0}to{opacity:1}}
@keyframes va-out{to{opacity:0}}
@keyframes va-draw{to{stroke-dashoffset:0}}
@keyframes va-drop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes va-zoom{to{transform:translate(14px,14px) scale(.24)}}
@keyframes va-slide{0%{transform:none}38%{transform:translateX(-212px)}62%{transform:translateX(-212px)}100%{transform:none}}
@keyframes va-spin{0%{transform:none}38%{transform:rotate(-0deg)}62%{transform:rotate(-0deg)}100%{transform:none}}
@keyframes va-cap{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
@keyframes va-cap-last{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-delay:0s!important;animation-duration:1ms!important}}
</style>
<defs>
<pattern id="va-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.045)"/></pattern>
<pattern id="va-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#2a2826"/><path d="M0 0V10" stroke="#5a5650" stroke-width="2"/></pattern>
<linearGradient id="va-stV" x1="0" x2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".45" stop-color="#cfcfcf"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient>
<linearGradient id="va-stH" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".45" stop-color="#cfcfcf"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient>
<linearGradient id="va-blk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset=".5" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
<pattern id="va-wood" width="44" height="80" patternUnits="userSpaceOnUse"><rect width="44" height="80" fill="#8a5d36"/><path d="M7 0Q10 40 7 80M18 0Q15 26 19 52T18 80M30 0Q33 34 29 80M39 0Q37 40 40 80" fill="none" stroke="#6e4728" stroke-width="1.3"/></pattern>
<radialGradient id="va-disc"><stop offset="0" stop-color="#6a6a6a"/><stop offset="1" stop-color="#262626"/></radialGradient>
<marker id="va-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4a373"/></marker>
<linearGradient id="va-shadow" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(0,0,0,.55)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></linearGradient>
</defs>
<rect width="600" height="700" fill="#141414"/>
<rect class="va-in" width="600" height="700" fill="url(#va-grid)"/>
<g class="va-elev"><rect x="20" y="180" width="560" height="412" fill="rgba(255,255,255,0.03)"/><path d="M20 180H580" stroke="#6a6a6a" stroke-width="1.5"/><rect x="20" y="592" width="560" height="10" fill="url(#va-hatch)"/><path d="M20 592H580" stroke="#b0b0b0" stroke-width="1.8"/><rect x="362" y="214" width="176" height="378" fill="#0b0b0b"/><path d="M362 592V214H538V592" fill="none" stroke="#7a7a7a" stroke-width="1.5"/><rect x="402" y="284" width="70" height="110" fill="#1d2a22" stroke="#33463a"/><rect x="100" y="172" width="460" height="8" fill="none" stroke="#d4a373" stroke-width="1.2" stroke-dasharray="6 4"/><g class="va-slide"><rect x="350" y="184" width="200" height="404" rx="2" fill="url(#va-wood)" stroke="#d9c3a5" stroke-width="1.8"/><rect x="378" y="224" width="144" height="162" rx="2" fill="none" stroke="#4a2e18" stroke-width="2.2"/><rect x="378" y="406" width="144" height="162" rx="2" fill="none" stroke="#4a2e18" stroke-width="2.2"/><rect x="366" y="378" width="14" height="66" rx="4" fill="url(#va-stV)" stroke="#9a9a9a"/></g></g>
<g class="va-elevlbl" style="animation-delay:8s"><path d="M300 172L300 150" stroke="#8a8a8a" stroke-width="1.2"/><text x="190" y="144" class="va-lbl2">sín a mennyezetben</text></g>
<g class="va-det">
<rect x="0" y="0" width="600" height="610" fill="#161616"/>
<rect class="va-in" width="600" height="610" fill="url(#va-grid)"/>
<g class="va-in" style="animation-delay:1.0s"><rect x="20" y="40" width="560" height="120" fill="url(#va-hatch)"/></g><path class="va-dr" pathLength="1" style="animation-delay:0.3s" d="M20 160H230M370 160H580" fill="none" stroke="#b0b0b0" stroke-width="2.2" /><g class="va-in" style="animation-delay:1.9s"><path d="M230 160V96H370V160H346V120H254V160Z" fill="url(#va-stH)" stroke="#d4a373" stroke-width="1.6"/></g><path class="va-dr" pathLength="1" style="animation-delay:1.6s" d="M230 160V96H370V160" fill="none" stroke="#d4a373" stroke-width="2.2" /><g class="va-drop" style="animation-delay:2.8s"><rect x="262" y="126" width="76" height="20" rx="4" fill="url(#va-stH)" stroke="#9a9a9a"/><circle cx="276" cy="134" r="10" fill="url(#va-disc)" stroke="#d0d0d0"/><circle cx="276" cy="134" r="4" fill="#d4a373"/><circle cx="324" cy="134" r="10" fill="url(#va-disc)" stroke="#d0d0d0"/><circle cx="324" cy="134" r="4" fill="#d4a373"/></g><g class="va-in" style="animation-delay:3.6s"><rect x="294" y="146" width="12" height="58" fill="url(#va-stV)" stroke="#9a9a9a"/></g><g class="va-in" style="animation-delay:4.2s"><rect x="250" y="204" width="100" height="10" fill="url(#va-stH)" stroke="#9a9a9a"/><rect x="262" y="214" width="76" height="376" fill="url(#va-wood)" stroke="#d9c3a5" stroke-width="1.8"/></g><g class="va-detlbl" style="animation-delay:0.9s,5.8s"><path d="M300 60L300 60" stroke="#8a8a8a" stroke-width="1.4"/><text x="300" y="30" class="va-lbl" text-anchor="middle">mennyezet</text></g><g class="va-detlbl" style="animation-delay:2.1s,5.8s"><path d="M368 110L420 86" stroke="#8a8a8a" stroke-width="1.4"/><text x="426" y="92" class="va-lbl" text-anchor="start">rejtett sínprofil</text></g><g class="va-detlbl" style="animation-delay:3.1s,5.8s"><path d="M330 136L420 150" stroke="#8a8a8a" stroke-width="1.4"/><text x="426" y="158" class="va-lbl" text-anchor="start">csapágyazott görgők</text></g><g class="va-detlbl" style="animation-delay:3.8s,5.8s"><path d="M306 180L420 214" stroke="#8a8a8a" stroke-width="1.4"/><text x="426" y="222" class="va-lbl" text-anchor="start">függesztőcsavar</text></g><g class="va-detlbl" style="animation-delay:4.5s,5.8s"><path d="M338 400L420 400" stroke="#8a8a8a" stroke-width="1.4"/><text x="426" y="408" class="va-lbl" text-anchor="start">ajtólap</text></g><g class="va-detlbl" style="animation-delay:2.4s,5.8s"><path d="M232 128L150 240" stroke="#8a8a8a" stroke-width="1.4"/><text x="40" y="262" class="va-lbl" text-anchor="start">a sín lehet a</text></g><g class="va-detlbl" style="animation-delay:2.4s,5.8s"><text x="40" y="288" class="va-lbl">falba süllyesztve is</text></g>
<rect x="0" y="0" width="600" height="610" fill="none" stroke="#d4a373" stroke-width="7" class="va-in" style="animation-delay:6.2s"/>
</g>
<path d="M0 620H600" stroke="rgba(255,255,255,.12)"/>
<text x="300" y="664" class="va-cap va-c1">A sín elbújik, a görgők halkan futnak.</text><text x="300" y="664" class="va-cap va-c2">Kívülről nem látszik vasalat.</text><text x="300" y="664" class="va-cap va-c3">Csak az ajtólap marad szem előtt.</text>
<g class="va-in" style="animation-delay:.2s"><text x="20" y="694" class="va-tb">ROLL’N’DOOR · REJTETT VASALAT</text><text x="580" y="694" text-anchor="end" class="va-tb2">szemléltető, nem méretarányos</text></g>
</svg>
